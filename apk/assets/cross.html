<!DOCTYPE html>
<html lang="en" data-theme="valley">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>库若思 — Cross Color Puzzle</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg1:#f5ebe0;--bg2:#eddecf;
  --hdr:rgba(245,235,224,.92);
  --grid:#cdc1b4;
  --cell-empty:rgba(187,173,160,.12);
  --txt:#5a4e44;--txt-l:#f9f6f2;--txt-m:#8b7e74;
  --accent:#b87060;
  --glow:rgba(184,112,96,.35);
  --sh:rgba(90,78,68,.12);
  --rad:16px;--crad:8px;--gap:4px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --speed:.3s;
  --easy:#7aab6b;
  --medium:#c8b860;
  --hard:#b86868;
  --hell:#3d3535;
}
[data-theme="pixel"]{
  --bg1:#0a0a1a;--bg2:#12122a;
  --hdr:rgba(10,10,26,.95);
  --grid:#1a1a3a;
  --cell-empty:rgba(30,30,80,.25);
  --txt:#e0e0ff;--txt-l:#fff;--txt-m:#6060a0;
  --accent:#ffd700;
  --glow:rgba(255,215,0,.3);
  --sh:rgba(0,0,0,.4);
  --rad:4px;--crad:2px;--gap:3px;
  --font:'Courier New',Consolas,monospace;
  --speed:.15s;
  --easy:#2ecc71;
  --medium:#f1c40f;
  --hard:#e74c3c;
  --hell:#ffd700;
}

html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--txt);
  display:flex;justify-content:center;align-items:center;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:background .6s;
}

/* BG deco */
[data-theme="valley"] body::before{
  content:'';position:fixed;inset:-50%;width:200%;height:200%;
  background:
    radial-gradient(circle at 20% 30%,rgba(184,112,96,.06),transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(106,175,184,.06),transparent 50%);
  pointer-events:none;animation:bgF 30s ease-in-out infinite;
}
@keyframes bgF{0%,100%{transform:translate(0,0)}50%{transform:translate(2%,-2%)}}
[data-theme="pixel"] body::before{
  content:'';position:fixed;inset:0;
  background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:24px 24px;pointer-events:none;
}
[data-theme="pixel"] body::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5));
  pointer-events:none;
}

/* Layout */
#app{
  position:relative;
  width:100%;max-width:440px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) 12px 12px;
}
#game{width:100%}

/* Header */
header{width:100%;display:flex;flex-direction:column;gap:8px;padding:10px 0;position:relative;z-index:10}
.hdr-top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:300;letter-spacing:8px;text-transform:uppercase}
[data-theme="pixel"] .logo{font-weight:700;letter-spacing:4px;text-shadow:0 0 10px var(--accent)}
.hdr-btns{display:flex;gap:8px;position:relative}

/* ═══ Custom volume sliders ═══ */
.vol-slider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:28px;background:transparent;outline:none;cursor:pointer;
}
.vol-slider::-webkit-slider-runnable-track{
  height:6px;border-radius:3px;
  background:linear-gradient(to right,
    var(--accent,#c75d3a) 0%,
    var(--accent,#c75d3a) var(--fill,50%),
    rgba(128,128,128,0.2) var(--fill,50%),
    rgba(128,128,128,0.2) 100%);
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.12);
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:#fff;border:2px solid var(--accent,#c75d3a);
  box-shadow:0 2px 6px rgba(0,0,0,0.25),0 0 0 0 var(--glow,rgba(199,93,58,0.2));
  margin-top:-6px;
  transition:box-shadow .2s,transform .1s;
}
.vol-slider:active::-webkit-slider-thumb{
  transform:scale(1.15);
  box-shadow:0 2px 8px rgba(0,0,0,0.3),0 0 0 6px var(--glow,rgba(199,93,58,0.15));
}
.btn{
  font-family:var(--font);background:var(--accent);color:var(--txt-l);
  border:none;border-radius:var(--crad);padding:8px 16px;
  font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;
  transition:all .2s;
}
.btn:active{transform:scale(.95)}
.btn-icon{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;
  background:rgba(187,173,160,.3);color:var(--txt);border:1px solid var(--grid);font-size:16px;border-radius:50%;
  line-height:1;text-align:center}
[data-theme="pixel"] .btn-icon{background:rgba(30,30,80,.85)}
[data-theme="pixel"] .btn{background:#c0392b}
.btn-icon.disabled{opacity:.35;cursor:default;pointer-events:none}
.lang-btn{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:0;padding:4px 8px;
  background:transparent;color:var(--txt);border:1px solid var(--grid);border-radius:var(--crad);cursor:pointer;line-height:1}
[data-theme="pixel"] .lang-btn{border-color:rgba(255,255,255,.15)}

.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:30px}
.seed-row{text-align:center;font-size:11px;color:var(--txt-m);letter-spacing:.5px;margin-top:4px;font-family:'Courier New',Consolas,monospace}
.seed-btns{display:flex;justify-content:center;gap:8px;margin-top:6px}
.btn-sm{font-size:10px;padding:4px 10px;letter-spacing:.5px}
.seed-input{width:100%;padding:10px 12px;border:1px solid var(--grid);border-radius:var(--crad);font-size:16px;font-family:'Courier New',Consolas,monospace;background:var(--bg1);color:var(--txt);text-align:center;letter-spacing:3px;margin:0 0 16px;outline:none;line-height:1.8;box-sizing:border-box}
.seed-input:focus{border-color:var(--accent)}
.grid-textarea{width:100%;padding:8px;border:1px solid var(--grid);border-radius:var(--crad);font-size:11px;font-family:'Courier New',Consolas,monospace;background:var(--bg1);color:var(--txt);resize:none;outline:none;line-height:1.5;box-sizing:border-box;letter-spacing:0}
.grid-textarea:focus{border-color:var(--accent)}
.stat{
  background:var(--cell-empty);border:1px solid var(--grid);
  border-radius:var(--crad);padding:5px 12px;
  display:flex;flex-direction:column;align-items:center;min-width:64px;
  transition:all .4s;
}
.stat-l{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt-m)}
.stat-v{font-size:20px;font-weight:600;color:var(--txt);transition:transform .2s,color .2s}
.stat-v.pop{animation:spop .3s ease}
@keyframes spop{0%{transform:scale(1)}40%{transform:scale(1.25);color:var(--accent)}100%{transform:scale(1)}}

/* Grid */
#game{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative}
#gwrap{
  position:relative;width:min(84vw,360px);aspect-ratio:1;
  border-radius:var(--rad);overflow:hidden;
  margin-bottom:50px;
  transform:translateY(-4px);
}
#grid{
  width:100%;height:100%;
  display:grid;grid-template-columns:repeat(var(--n,10),1fr);
  gap:var(--gap);padding:var(--gap);
  background:var(--grid);border-radius:var(--rad);
  transition:background .5s;
}
#grid.n4{--n:4;--gap:8px}
#grid.n6{--n:6;--gap:6px}
#grid.n8{--n:8;--gap:5px}
#grid.n10{--n:10;--gap:4px}
[data-theme="pixel"] #grid::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);
  pointer-events:none;border-radius:var(--rad);z-index:5;
}

.cell{
  background:var(--cell-empty);border-radius:var(--crad);
  cursor:pointer;position:relative;
  transition:background-color var(--speed),transform .12s,box-shadow .25s;
  will-change:transform,background-color;
}
.cell:active{transform:scale(.88)}

/* v2.0.70-numbers: numeric value overlay inside each cell (empty=0, gray=1, red=2, ...) */
.cell .num{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Courier New',Consolas,monospace;font-weight:700;
  pointer-events:none;user-select:none;-webkit-user-select:none;z-index:2;
}
#grid.n4 .cell .num{font-size:30px}
#grid.n6 .cell .num{font-size:22px}
#grid.n8 .cell .num{font-size:17px}
#grid.n10 .cell .num{font-size:13px}

.cell.tap{animation:tapA .35s ease}
@keyframes tapA{0%{transform:scale(1)}40%{transform:scale(.82)}100%{transform:scale(1)}}
.cell.pop{animation:popA .3s ease}
@keyframes popA{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.cell.gone{animation:goneA .4s ease-out}
@keyframes goneA{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.3}100%{transform:scale(1);opacity:1}}
.cell.hint{
  box-shadow:0 0 0 3px var(--accent),0 0 20px var(--glow);
  z-index:10;animation:hintA .7s ease;
}
@keyframes hintA{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}

@keyframes shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}
  60%{transform:translate(-1px,2px)}80%{transform:translate(1px,-2px)}
}
#grid.shake{animation:shake .2s ease}

/* Canvas */
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* v2.0.63-aux: helper row/col minima — no outline, no fill, plain text only */
#aux{
  position:absolute;left:0;top:0;right:0;bottom:0;
  pointer-events:none;user-select:none;-webkit-user-select:none;
  z-index:20;font-family:'Courier New',Consolas,monospace;font-weight:700;
}
#aux .hslot{
  position:absolute;display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);white-space:nowrap;
}
#aux .cmin{color:#000}
#aux .rmin{color:#fff}
#aux .sum-s{color:#e03131}
#aux .sum-w{color:#2f9e44}
/* v2.0.70-hl: yellow glow outline for cells with colMin+rowMin−self > 1 */
#aux .hl{
  position:absolute;box-sizing:border-box;
  border:3px solid #ffd700;border-radius:var(--crad);
  box-shadow:0 0 10px 2px rgba(255,215,0,.55),inset 0 0 8px rgba(255,215,0,.35);
  pointer-events:none;
}
[data-theme="pixel"] #aux .cmin{color:#ffd700}
[data-theme="pixel"] #aux .rmin{color:#fff}
[data-theme="pixel"] #aux .sum-s{color:#ff6b6b}
[data-theme="pixel"] #aux .sum-w{color:#51cf66}

/* Overlay */
.ov{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .4s;
}
.ov.hide{opacity:0;pointer-events:none}
.ov-card{
  background:var(--hdr);border:1px solid var(--grid);
  border-radius:var(--rad);padding:32px 40px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  max-width:340px;width:90%;
}
.ov-icon{font-size:48px;margin-bottom:8px}
.ov-title{font-size:24px;font-weight:300;letter-spacing:4px;margin-bottom:12px}
[data-theme="pixel"] .ov-title{font-weight:700;text-shadow:0 0 15px var(--accent)}
.ov-score{font-size:18px;color:var(--txt);margin-bottom:8px}
.ov-msg{font-size:14px;color:var(--txt-m);margin-bottom:4px}
.btn-pri{padding:12px 32px;font-size:14px;letter-spacing:2px;margin-top:8px}

/* Footer */
footer{display:flex;gap:8px;padding:10px 0;justify-content:space-between;width:100%}
.undo-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:102px;background:none;border:none;padding:4px;cursor:pointer;color:var(--txt);opacity:.5;transition:opacity .2s;z-index:5}
.undo-btn:hover,.undo-btn:active{opacity:.8}
.undo-btn.disabled{opacity:.15;cursor:default;pointer-events:none}

/* Help overlay */
.help-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:opacity .4s;
}
.help-overlay.hide{opacity:0;pointer-events:none}
.help-card{
  background:var(--hdr);border:1px solid var(--grid);
  border-radius:var(--rad);padding:28px 32px;
  max-width:360px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  text-align:left;font-size:14px;line-height:1.8;color:var(--txt);
}
.help-card h3{text-align:center;font-size:18px;font-weight:300;letter-spacing:4px;margin-bottom:16px;color:var(--accent)}
[data-theme="pixel"] .help-card h3{font-weight:700;text-shadow:0 0 10px var(--accent)}
.help-card p{margin-bottom:8px}
.help-card .help-hint{text-align:center;font-size:12px;color:var(--txt-m);margin-top:12px}

/* Launcher */
#launcher{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;width:100%;padding:20px 0 0;margin-top:-50px}
.launch-title{font-size:32px;font-weight:200;letter-spacing:10px;margin-bottom:20px;text-transform:uppercase;display:none}
.launch-sub{font-size:12px;color:var(--txt-m);letter-spacing:3px;margin-bottom:30px;text-transform:uppercase}
.level-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:360px}
.level-btn{
  font-family:var(--font);
  background:var(--hdr);border:2px solid var(--grid);
  border-radius:var(--rad);
  padding:24px 16px;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:all .25s;
  position:relative;overflow:hidden;
}
.level-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--lvl-color,.7aab6b),transparent 70%);
  opacity:.15;pointer-events:none;
}
.level-btn:active{transform:scale(.97)}
.level-btn .lvl-name{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--lvl-color)}
.level-btn .lvl-grid{display:grid;gap:2px;width:60px;height:60px;margin:6px 0}
.level-btn .lvl-grid div{border-radius:2px;background:var(--lvl-color);opacity:.6}
.level-btn .lvl-meta{font-size:10px;color:var(--txt-m);letter-spacing:1px}
.level-btn .lvl-desc{font-size:11px;color:var(--txt-m);line-height:1.3;max-width:140px}
[data-theme="pixel"] .level-btn .lvl-name{text-shadow:0 0 8px var(--lvl-color)}


/* ═══ v0.11.2 Landscape: 左半屏 UI + 右半屏棋盘 ═══ */
@media (orientation:landscape){
  /* 整体两栏：左栏=原竖屏 UI（header+stats+seed+footer+undo），右栏=棋盘 */
  #app{max-width:none;flex-direction:row;align-items:stretch}
  header{width:220px;max-width:220px;flex:0 0 auto;padding:12px 12px 0}
  .hdr-top{flex-wrap:wrap;gap:6px}
  .logo{letter-spacing:4px;font-size:20px;transform:none!important}
  .stats{margin-top:10px;justify-content:flex-start}
  .stat{font-size:13px;padding:4px 10px}
  .seed-row{margin-top:8px}
  .seed-btns{margin-top:6px}
  /* footer/undo 是 #app 的行内子元素，横屏两栏下改为绝对定位沉到左栏底部 */
  footer#ftr{position:absolute;left:12px;bottom:12px;width:220px;flex-wrap:wrap;gap:6px;justify-content:flex-start;z-index:15}
  .undo-btn{position:absolute;left:110px;bottom:64px;transform:none;z-index:15}
  /* 右半屏：棋盘居中 + 辅助数值覆盖层 */
  #game{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:8px 0 8px 16px}
  #gwrap{width:min(64vh,100%) !important;max-width:none;margin-bottom:0;transform:none;flex:0 0 auto}
  #aux{position:absolute;inset:0}  /* aux 相对 #game 定位（#game position:relative 已有） */
  /* Launcher 横屏：四难度卡一排 */
  #launcher{margin-top:0;padding:0 12px}
  .level-grid{grid-template-columns:repeat(4,1fr);max-width:none;gap:10px;width:100%}
  .level-btn{padding:12px 8px;gap:4px}
  .level-btn .lvl-grid{width:34px;height:34px;margin:2px 0}
  .level-btn .lvl-name{font:700 12px/1.2 var(--font);letter-spacing:2px}
  .level-btn .lvl-meta{font-size:9px}
  .level-btn .lvl-desc{font-size:9px;max-width:120px;line-height:1.25}
  .launch-sub{margin-bottom:12px;font-size:10px}
  .launch-title{display:none}
  #volPanel{left:0;right:auto}
}

.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hdr-top">
      <button id="tk-back" aria-label="返回 Tookies" style="flex:0 0 auto;min-width:36px;height:36px;padding:0 10px;margin-right:6px;background:transparent;border:0;color:var(--txt);font-size:20px;line-height:1;">‹</button>
      <span class="logo" id="logo" style="cursor:pointer;transform:translateX(-35px)">CROSS</span>
      <div class="hdr-btns">
        <button class="btn-icon" id="bsnd" title="Sound" style="font-size:16px;line-height:1;padding:2px 4px">♫</button>
        <div id="volPanel" class="hide" style="position:absolute;top:42px;right:8px;z-index:200;background:var(--card,#f5f0e8);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:12px 14px;width:180px;display:flex;flex-direction:column;gap:10px">
          <div>
            <div style="font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between"><span>Music</span><span id="musicVal">50</span></div>
            <input type="range" id="musicSlider" class="vol-slider" min="0" max="100" value="50" style="--fill:50%">
          </div>
          <div>
            <div style="font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between"><span>SFX</span><span id="sfxVal">20</span></div>
            <input type="range" id="sfxSlider" class="vol-slider" min="0" max="100" value="20" style="--fill:20%">
          </div>
        </div>
        <button class="lang-btn btn-icon" id="blang" style="font-size:11px;font-weight:600;letter-spacing:1px">EN</button>
        <button class="btn-icon" id="bh" title="Help">?</button>
      </div>
    </div>
    <div class="stats" id="statsRow" style="display:none">
      <div class="stat"><span class="stat-l" data-i18n="taps">Taps</span><span class="stat-v" id="sc">0</span></div>
      <div class="stat"><span class="stat-l" data-i18n="left">Left</span><span class="stat-v" id="rm">—</span></div>
    </div>
    <div class="seed-row" id="seedRow" style="display:none"><span data-i18n="seed">seed</span>：<span id="seedVal">—</span></div>
    <div class="seed-btns" id="seedBtns" style="display:none">
      <button class="btn btn-sm" id="bLoadSeed" data-i18n="loadSeed">Load Seed</button>
      <button class="btn btn-sm" id="bImport" data-i18n="importMatrix">Import Matrix</button>
      <button class="btn btn-sm" id="bCopySeed" data-i18n="copySeed">Copy Seed</button>
    </div>
  </header>

  <!-- Launcher -->
  <div id="launcher">
    <div class="launch-title">CROSS</div>
    <div class="launch-sub" data-i18n="selectDifficulty">Select Difficulty</div>
    <div class="level-grid">
      <button class="level-btn" data-level="4" style="--lvl-color:var(--easy)">
        <div class="lvl-name" data-i18n="easy">EASY</div>
        <div class="lvl-grid" style="grid-template-columns:repeat(4,1fr)" id="preview4"></div>
        <div class="lvl-meta">4 × 4 · 3 colors</div>
        <div class="lvl-desc" data-i18n="easyDesc">Tap blocks to clear — the entire row and column each drop one color level.</div>
      </button>
      <button class="level-btn" data-level="6" style="--lvl-color:var(--medium)">
        <div class="lvl-name" data-i18n="medium">MEDIUM</div>
        <div class="lvl-grid" style="grid-template-columns:repeat(6,1fr)" id="preview6"></div>
        <div class="lvl-meta">6 × 6 · 5 colors</div>
        <div class="lvl-desc" data-i18n="mediumDesc">More cells and colors — same rules, deeper strategy.</div>
      </button>

// Dual-track BGM: A and B each restart bgm.aac every period t.
// B starts at delay d after A. Each track's gap is covered by the other.
// Timer-based (not loop=true) for precise t and d control.
var _bgmActive=null;
var _bgmPeriod=35560; // t: restart period in ms
var _bgmOffset=17780;  // d: B's delay after A in ms
var _bgmTimerA=null,_bgmTimerB=null,_bgmTimerBDelay=null;
function _restartTrack(el){
  try{ el.currentTime=0; }catch(e){}
  var p=el.play(); if(p&&p.catch)p.catch(()=>{});
}
function startBgm(){
  if(musicVol<=0)return;
  if(!_bgmA){
    _bgmA=new Audio('bgm.aac'); _bgmA.volume=musicVol; _bgmA.preload='auto'; _bgmA.load();
    _bgmB=new Audio('bgm.aac'); _bgmB.volume=musicVol; _bgmB.preload='auto'; _bgmB.load();
  }
  if(!_bgmActive){
    // Track A: start immediately, restart every t
    _restartTrack(_bgmA);
    _bgmTimerA=setInterval(function(){ _restartTrack(_bgmA); },_bgmPeriod);
    // Track B: start after delay d, then restart every t
    _bgmTimerBDelay=setTimeout(function(){
      _restartTrack(_bgmB);
      _bgmTimerB=setInterval(function(){ _restartTrack(_bgmB); },_bgmPeriod);
    },_bgmOffset);
    _bgmActive=true;
  }
}
function stopBgm(){
  if(_bgmTimerA)clearInterval(_bgmTimerA);
  if(_bgmTimerB)clearInterval(_bgmTimerB);
  if(_bgmTimerBDelay)clearTimeout(_bgmTimerBDelay);
  _bgmTimerA=_bgmTimerB=_bgmTimerBDelay=null;
  if(_bgmA){_bgmA.pause();_bgmA.currentTime=0;}
  if(_bgmB){_bgmB.pause();_bgmB.currentTime=0;}
  _bgmActive=null;
}

/* ═══ seed / PRNG ═══ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}

/* ═══ level gen (stacking) — uses current N & MAX ═══ */
function gen(seed){
  const rng=seed!=null?mulberry32(seed):Math.random;
  const g=[],seq=[];
  for(let r=0;r<N;r++){g[r]=[];for(let c=0;c<N;c++)g[r][c]=-1}
  while(true){
    const r=Math.floor(rng()*N),c=Math.floor(rng()*N);
    let exceed=false;
    for(let i=0;i<N;i++){if(g[r][i]>=MAX||g[i][c]>=MAX){exceed=true;break}}
    if(exceed)break;
    for(let i=0;i<N;i++){g[r][i]++;if(i!==r)g[i][c]++}
    seq.push({r,c});
  }
  return{grid:g,sol:seq.reverse()};
}

  '-1':'rgba(255,255,255,.28)',           // removed cell — ghost digit
  '0':null,'1':null,'2':null,'3':null,'4':null,'5':null,'6':null,'7':null,'8':null
};
const THEME_NUM_TEXT={
  valley:{'0':'#5a544c','1':'#fff','2':'#fff','3':'#6b5f2e','4':'#fff','5':'#fff','6':'#fff','7':'#fff','8':'#fff'},
  pixel:{'0':'#ecf0f1','1':'#fff','2':'#3d2b10','3':'#4a3a05','4':'#0d3f1e','5':'#0b3d38','6':'#12283d','7':'#fff','8':'#ecf0f1'}
};
function numTextColor(v){
  const tm=THEME_NUM_TEXT[theme];
  if(tm&&tm[v])return tm[v];
  if(v<0)return TEXT_COLORS['-1'];
  return '#fff';
}

/* ═══ render ═══ */
function cellColor(v){
  if(v<0||v>=PALETTE.length)return '';
  return (theme==='pixel'?PALETTE[v].p:PALETTE[v].v)||'';
}
/* v2.0.70-numbers: digit shown = palette index + 1 (empty slot=0, gray=1, red=2, …) */
function numLabel(v){return String(v+1)}
function setNum(el,v){
  let s=el.querySelector('.num');
  if(v<0){if(s)s.remove();return}
  if(!s){s=document.createElement('span');s.className='num';el.appendChild(s)}
  s.textContent=numLabel(v);
  s.style.color=numTextColor(v);
}
function render(){
  $g.innerHTML='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement('div');
    d.className='cell';
    const v=grid[r][c];
    d.style.background=cellColor(v);
    d.dataset.r=r;d.dataset.c=c;

    $g.appendChild(d);
  }
  resizeCv();
  updAux();
}
function upd(r,c){
  const el=$g.children[r*N+c];
  if(el){el.style.background=cellColor(grid[r][c]);setNum(el,grid[r][c])}
  updAux();

/* ═══ v2.0.63-aux: helper row/col minima ═══ */
/* Column minimum = min over cells; any empty cell (v<0) in the line forces 0.
   A fully empty line has no values → blank slot.
   Displayed digit = v+1 (gray=1 ... black=9) to match in-cell numbers;
   "0" from an empty-cell line displays as 0.
   Layout: top helper row = n column minima + S(sum, rightmost);
           right helper col = n row minima + W(sum, bottom). */
function lineMin(cells){
  let m=Infinity,hasVal=false;
  for(const v of cells){
    if(v<0){return -1}              // empty cell present → minimum reads 0
    if(v<m)m=v;
    hasVal=true;
  }
  return hasVal?m:null;             // all empty → blank
}
function colCells(c){const a=[];for(let r=0;r<N;r++)a.push(grid[r][c]);return a}
function rowCells(r){const a=[];for(let c=0;c<N;c++)a.push(grid[r][c]);return a}
function auxNumbers(){
  const cols=[],rows=[];
  for(let c=0;c<N;c++)cols.push(lineMin(colCells(c)));
  for(let r=0;r<N;r++)rows.push(lineMin(rowCells(r)));
  return {cols,rows};
}
function updAux(){
  const $a=$('aux');if(!$a)return;
  if(!grid.length||!grid[0]||!grid[0].length)return;      // grid not primed yet
  if(!$g.children.length)return;                           // cells not rendered yet
  /* v2.1.3: helper digits scale with cell size again (looks better); the board
     width shrinks per-N so the scaled digits still fit inside the screen. */
  const vw=Math.min(document.documentElement.clientWidth,window.innerWidth||1e9);
  if(window.matchMedia('(orientation:landscape)').matches){
    /* v0.11.2 横屏：宽度交给 CSS media 规则 min(78vh,100%)——内联 vw 公式是竖屏专属，
       会在横屏把棋盘钳到 360px 且压过样式表 */
    $('gwrap').style.width='';
  }else{
    const shrink={4:0.68,6:0.78,8:0.82,10:0.84}[N]||0.84;
    $('gwrap').style.width=`min(${Math.round(shrink*100)}vw,360px)`;
  }
  const {cols,rows}=auxNumbers();
  const disp=v=>v===null?'':(v===-1?'0':String(v+1));   // raw v → displayed digit
  const sumd=v=>v===null?0:(v===-1?0:v+1);              // summand: empty-line min counts 0
  const g=$g.getBoundingClientRect();
  const ar=$a.getBoundingClientRect();
  // v2.0.68-fix: build cell geometry from LAYOUT values (offsetLeft/Top/Width/Height),
  // which are immune to the running .tap/.pop/.gone scale animations. Reading
  // getBoundingClientRect() mid-animation positioned helper digits on the inflated
  // (scaled-out) rects and they never snapped back after the animation ended.
  const gx=g.left-$g.offsetLeft, gy=g.top-$g.offsetTop;   // #gwrap origin in viewport, at rest
  let html='';
  const cells=[];
  for(let i=0;i<N*N;i++){
    const el=$g.children[i];
    cells.push(el?{
      left:gx+el.offsetLeft, top:gy+el.offsetTop,
      width:el.offsetWidth, height:el.offsetHeight,
      right:gx+el.offsetLeft+el.offsetWidth,
      bottom:gy+el.offsetTop+el.offsetHeight
    }:null);
  }
  // v2.1.2: helper digits use HELL (10x10) sizing on ALL difficulties — fixed
  // font + font-based outward gap, so big-cell boards (4x4/6x6/8x8) no longer
  // push digits off-screen (cell-proportional offsets could exceed the margin).
  // v2.1.3: digits scale with cell size; outward gap scales with the font
  const AUX_FS=Math.max(14,Math.round(cells[0].height*0.45));
  const AUX_GAP=Math.max(10,Math.round(AUX_FS*1.1));
  // top helper row: column minima aligned above each column
  for(let c=0;c<N;c++){
    const cr=cells[c];
    const cx=cr.left-ar.left+cr.width/2;
    const cy=cells[0].top-ar.top-AUX_GAP;
    html+=`<div class="hslot cmin" style="left:${cx}px;top:${cy}px;font-size:${AUX_FS}px">${disp(cols[c])}</div>`;
  }
  // red sum: same row as the black digits, far right — the slot above the topmost white digit
  const sSum=cols.reduce((s,v)=>s+sumd(v),0);
  const topRight=cells[N-1];
  const sX=topRight.right-ar.left+AUX_GAP;
  const sY=cells[0].top-ar.top-AUX_GAP;
  html+=`<div class="hslot sum-s" style="left:${sX}px;top:${sY}px;font-size:${AUX_FS}px">${sSum}</div>`;
  // right helper col: row minima aligned right of each row
  for(let r=0;r<N;r++){
    const cr=cells[r*N+(N-1)];
    const cx=cr.right-ar.left+AUX_GAP;
    const cy=cr.top-ar.top+cr.height/2;
    html+=`<div class="hslot rmin" style="left:${cx}px;top:${cy}px;font-size:${AUX_FS}px">${disp(rows[r])}</div>`;
  }
  // green sum: same column as the white digits, very bottom — the slot below the last white digit
  const wSum=rows.reduce((s,v)=>s+sumd(v),0);
  const lastRow=cells[N*N-1];
  const wX=lastRow.right-ar.left+AUX_GAP;
  const wY=lastRow.bottom-ar.top+AUX_GAP;
  html+=`<div class="hslot sum-w" style="left:${wX}px;top:${wY}px;font-size:${AUX_FS}px">${wSum}</div>`;
  // v2.0.70-hl: yellow glow outline on cells where colMin + rowMin − self > 1.
  // Helper values use DISPLAY digits (gray=1 … black=9; line-with-empty reads 0);
  // self digit is the cell's own display value; removed cells (v<0) are skipped.
  const cd=v=>v===null?0:(v===-1?0:v+1);      // helper digit, null→0
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=grid[r][c];
    if(v<0)continue;
    if(cd(cols[c])+cd(rows[r])-(v+1)>1){
      const cr=cells[r*N+c];
      html+=`<div class="hl" data-i="${r*N+c}" style="left:${cr.left-ar.left}px;top:${cr.top-ar.top}px;width:${cr.width}px;height:${cr.height}px"></div>`;
    }
  }
  $a.innerHTML=html;
}
function cr0W(cr){return Math.max(cr.width,14)}

/* Force-paint every not-yet-painted cell of the current pendingFx.
   The shockwave state machine paints cells only when a beam head reaches
   them; if the fx is discarded early (next tap replaces it) or the safety
   net fires, unpainted cells would keep stale colors forever. */
function flushPendingFx(){
  if(!pendingFx)return;
  pendingFx.affected.forEach(cell=>{
    if(!cell.done){
      cell.done=true;
      upd(cell.r,cell.c);
    }
  });
  pendingFx.gone.forEach(g=>{
    if(!g.done){
      g.done=true;
      const gel=$g.children[g.r*N+g.c];
      if(gel){gel.classList.add('gone');setTimeout(()=>gel.classList.remove('gone'),400)}
      emit(g.r,g.c);
    }
  });
  pendingFx=null;
}

/* ═══ tap logic ═══ */
function tap(r,c,fromDemo){
  if(grid[r][c]<0)return;
  if(cracking&&!fromDemo)return; // v2.0.54: player input locked while the solution demo plays
  if(!cracking&&busy)return;
  flushPendingFx(); // v2.0.51: previous tap's visuals must complete before this one starts
  busy=true;
  if(!cracking){taps++;popSc();}
  /* v2.1.0: old rule "first player tap disables crack" removed — button state
     is now governed by dead-position detection (updAlive) instead. */
  if(!fromDemo){ // v2.0.55: demo taps must not pollute the undo stack
    undoStack.push(grid.map(row=>[...row]));
    tapHist.push({r,c});      // v2.1.0: record player/crack taps for dead-check
    $('bu').classList.remove('disabled');
  }
  playSfx('laser');
  emitSW(r,c);

  /* ── compute affected cells ── */
  const aff=[];
  for(let cc=0;cc<N;cc++)if(grid[r][cc]>=0)aff.push({r,c:cc,d:Math.abs(cc-c)});
  for(let rr=0;rr<N;rr++)if(rr!==r&&grid[rr][c]>=0)aff.push({r:rr,c,d:Math.abs(rr-r)});

  const tapEl=$g.children[r*N+c];
  if(tapEl){tapEl.classList.add('tap');setTimeout(()=>tapEl.classList.remove('tap'),350)}

  /* ── grid update + gray count (sync — game logic must be immediate) ── */
  const gone=[];
  const grayClr=[];
  for(const cell of aff){
    if(grid[cell.r][cell.c]===0)grayClr.push(1);
    grid[cell.r][cell.c]--;
    if(grid[cell.r][cell.c]<-1)grid[cell.r][cell.c]=-1;
    if(grid[cell.r][cell.c]===-1)gone.push({r:cell.r,c:cell.c});
  }

  /* ── win/fail check: data is correct immediately, but the banner waits for animation ── */
  let res='continue';
  if(!cracking){
    const gc=grayClr.length;
    lastGray=gc;
    res=chkGray(gc);
    // Store result; tryJudge() in tickParts fires showWin/showFail only when ALL
    // animation state arrays (shockwaves, diamonds, parts) and pendingFx are empty.
    if(res==='win'||res==='fail')pendingResult=res;
  }

  /* ── visual fx: queued, triggered when shockwave head reaches each cell ── */
  const tapCell=$g.children[r*N+c];
  const tapCr=tapCell?tapCell.getBoundingClientRect():null;
  const cvr=$cv.getBoundingClientRect();
  pendingFx={
    affected:aff.map(x=>{
      // Clicked cell itself — mark done immediately (no beam reaches it)
      const isClick=x.r===r&&x.c===c;
      return {r:x.r,c:x.c,d:x.d,key:x.r*N+x.c,done:!!isClick}
    }),
    gone:gone.map(g=>{
      // Clicked cell itself if it ended up in gone — mark done immediately
      const isClick=g.r===r&&g.c===c;
      return {r:g.r,c:g.c,key:g.r*N+g.c,done:!!isClick}
    }),
    result:res,
    _tapRow:r,_tapCol:c,
    _tapCx:tapCr?tapCr.left-cvr.left+tapCr.width/2:0,
    _tapCy:tapCr?tapCr.top-cvr.top+tapCr.height/2:0
  };
  // Fire the clicked cell's visual fx right away (it's the laser origin, no beam "arrives")
  const selfEl=$g.children[r*N+c];
  if(selfEl){selfEl.classList.add('pop');setTimeout(()=>selfEl.classList.remove('pop'),300)}
  upd(r,c);
  // If clicked cell is in `gone`, fire its gone animation too (with same 40ms head-pass delay)
  const isSelfGone=!!pendingFx.gone.find(g=>g.done);
  if(isSelfGone){
    setTimeout(()=>{
      if(selfEl){selfEl.classList.add('gone');setTimeout(()=>selfEl.classList.remove('gone'),400)}
      emit(r,c);
    },40);
  }
  // SAFETY NET: if for any reason the shockwave-arrival-driven fx state machine
  // fails to complete (e.g. DOM rebuild, hit-detection edge case), force-unlock busy
  // after 2.5s so the player is never stuck. Also clear pendingFx and any lingering
  // shockwaves so the next tap() starts clean.
  const thisPendingFx=pendingFx;
  setTimeout(()=>{
    if(pendingFx===thisPendingFx){
      // Still unlocked. Force everything done.
      pendingFx.affected.forEach(c=>c.done=true);
      pendingFx.gone.forEach(g=>{
        if(!g.done){
          g.done=true;
          const gel=$g.children[g.r*N+g.c];
          if(gel){gel.classList.add('gone');setTimeout(()=>gel.classList.remove('gone'),400)}
          emit(g.r,g.c);
        }
      });
      if(theme==='pixel'&&pendingFx.affected.length>0){$g.classList.add('shake');setTimeout(()=>$g.classList.remove('shake'),120)}
      busy=false;
      pendingFx=null;
      updAlive();   // v2.1.0-fix: safety-net unlock must also refresh crack state
    }
  },2500);
}

function chkGray(gc){
  let rem=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]>=0)rem++;
  if(rem===0&&gc===TARGET)return 'win';
  if(rem===0&&gc!==TARGET)return 'fail';
  return 'continue';
}
function checkStuck(){
  let remaining=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]>=0)remaining++;
  return remaining<TARGET;
}

/* ═══ universal solver ═══ */
function universalSolver(g){
  const n=N;
  /* D[i][j] = required decrement for cell (i,j) */
  const D=[];let T=0;
  for(let i=0;i<n;i++){D[i]=[];for(let j=0;j<n;j++){D[i][j]=g[i][j]>=0?g[i][j]+1:0;T+=D[i][j]}}
  if(T%TARGET!==0)return null;
  const S=T/TARGET;
  /* row/col sums of D */
  const Di=[],Ej=[];
  for(let i=0;i<n;i++){Di[i]=0;for(let j=0;j<n;j++)Di[i]+=D[i][j]}
  for(let j=0;j<n;j++){Ej[j]=0;for(let i=0;i<n;i++)Ej[j]+=D[i][j]}
  /* A[i]=row taps, B[j]=col taps */
  const A=[],B=[];
  for(let i=0;i<n;i++){A[i]=(Di[i]-S)/9;if(A[i]<0||A[i]!==Math.round(A[i]))return null}
  for(let j=0;j<n;j++){B[j]=(Ej[j]-S)/9;if(B[j]<0||B[j]!==Math.round(B[j]))return null}
  /* Z[i][j]=taps at (i,j) */
  const taps=[];
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const z=A[i]+B[j]-D[i][j];
    if(g[i][j]>=0&&z<0)return null;
    if(g[i][j]<0&&z!==0)return null;
    for(let k=0;k<z;k++)taps.push({r:i,c:j});
  }
  /* schedule taps: greedy by descending cell value */
  taps.sort((a,b)=>g[b.r][b.c]-g[a.r][a.c]);
  const gc=g.map(row=>[...row]);
  const seq=[];const used=new Set();
  while(seq.length<taps.length){
    let found=false;
    for(let idx=0;idx<taps.length;idx++){
      if(used.has(idx))continue;
      const t=taps[idx];
      if(gc[t.r][t.c]<0)continue;
      let ok=true;
      for(let k=0;k<n;k++){
        if(gc[t.r][k]>=0&&gc[t.r][k]-1<-1){ok=false;break}
        if(k!==t.r&&gc[k][t.c]>=0&&gc[k][t.c]-1<-1){ok=false;break}
      }
      if(!ok)continue;
      for(let k=0;k<n;k++){
        if(gc[t.r][k]>=0)gc[t.r][k]--;
        if(k!==t.r&&gc[k][t.c]>=0)gc[k][t.c]--;
      }
      seq.push({r:t.r,c:t.c});used.add(idx);found=true;break;
    }
    if(!found)return null;
  }
  return seq;
}

/* ═══ v2.1.0: dead-position detection & smart crack ═══ */
function buildSolNeed(){
  // Derive per-cell required tap counts from the active solution.
  solNeed=new Array(N*N).fill(0);
  if(!sol||!sol.length)return;
  for(const s of sol)solNeed[s.r*N+s.c]++;
}
function tapCountsNow(){
  // Reconstruct current per-cell tap counts from tapHist (source of truth).
  const m=new Array(N*N).fill(0);
  for(const h of tapHist)m[h.r*N+h.c]++;
  return m;
}
function aliveStatus(){
  // 'win'      — nothing left to tap (game effectively over)
  // 'alive'    — every tapped cell count ≤ its required count
  // 'dead'     — some cell over-tapped beyond the solution → unsolvable
  const need=solNeed||new Array(N*N).fill(0);
  const have=tapCountsNow();
  for(let i=0;i<N*N;i++){
    if(have[i]>need[i]+1e-9)return 'dead';
  }
  if(need.every(v=>v===0))return 'no-sol';   // no solution available at all
  return 'alive';
}
function updAlive(){
  const st=aliveStatus();
  const bc=$('bc');if(!bc)return;
  const bannerUp=!$ov.classList.contains('hide')||!!document.getElementById('stuckBanner');
  if(gameOver||bannerUp||busy||st!=='alive'){
    bc.classList.add('disabled');
  }else{
    bc.classList.remove('disabled');
  }
}
function resetCrackState(){
  tapHist=[];
  buildSolNeed();
  gameOver=false;
  updAlive();
}

/* ═══ crack ═══ */
function crack(){
  /* v2.1.0: single random remaining solution step — a REAL tap: counts toward
     TAPS, undoable, participates in win/fail judging. Disabled when dead. */
  if(busy||gameOver)return;
  if(aliveStatus()!=='alive')return;
  /* ensure we have a solution: seed games carry one; imported games solve on demand */
  if(!sol.length){
    sol=universalSolver(grid);
    if(!sol){updAlive();return}
    buildSolNeed();
  }
  const need=solNeed;
  const have=tapCountsNow();
  const pool=[];
  for(let i=0;i<N*N;i++){
    const rem=(need[i]||0)-(have[i]||0);
    for(let k=0;k<rem;k++)pool.push(i);
  }
  if(!pool.length){updAlive();return}
  const idx=pool[Math.floor(Math.random()*pool.length)];
  const r=Math.floor(idx/N),c=idx%N;
  /* brief hint flash, then execute as a REAL tap (fromDemo=false → undoable, scored) */
  const el=$g.children[r*N+c];
  if(el){
    el.classList.add('hint');
    setTimeout(()=>{el.classList.remove('hint');tap(r,c,false)},450);
  }else{
    tap(r,c,false);
  }
}

/* ═══ controls ═══ */

  // Clear all animation state from any previous run
  pendingFx=null;
  shockwaves.length=0;

/* ═══ particles — laser-cut molten spark system ═══
   Micro white-hot sparks that cool to deep red (like sparks from a laser
   cutting steel): ballistic splatter with drag + gravity, additive glow,
   motion streaks. Replaces the old ring-ripple + confetti explosion. */
let parts=[];
let shockwaves=[];
let diamonds=[];
let cellCenters=[];
let pendingFx=null;
const SPARK_GRAV=0.055;   // px/tick² — sparks droop as they fly
const SPARK_DRAG=0.985;   // air resistance per tick
const SPARK_MAX=600;      // hard cap for performance

function sparkColor(life){
  // cooling gradient: white-hot → amber → red-orange → deep red
  // (short white phase — sparks must read RED, like cutting steel)
  if(life>0.85)return '#fff6dc';
  if(life>0.55)return '#ffb041';
  if(life>0.30)return '#ff5412';
  if(life>0.14)return '#d92b0a';
  return '#8a1405';
}

function addSpark(x,y,vx,vy,power){
  if(parts.length>=SPARK_MAX)return;
  parts.push({
    x,y,vx,vy,
    sz:(0.6+Math.random()*1.3)*(power||1),
    life:1,
    dec:0.020+Math.random()*0.030 // ~25-45 ticks of visible glow
  });
}

// spray `count` sparks from (x,y) biased along the cutting direction (dx,dy)
function emitSparks(x,y,dx,dy,count,power){
  const len=Math.hypot(dx,dy);
  const bx=len?dx/len:0, by=len?dy/len:0;
  for(let i=0;i<count;i++){
    let ux,uy;
    if(len){
      const cone=(Math.random()-0.5)*0.9; // ±~26° spray cone around the cut
      const ca=Math.cos(cone), sa=Math.sin(cone);
      ux=bx*ca-by*sa; uy=bx*sa+by*ca;
    }else{
      const a=Math.random()*Math.PI*2; ux=Math.cos(a); uy=Math.sin(a);
    }
    const sp=(1.5+Math.random()*4.2)*power;
    addSpark(x,y, ux*sp+(Math.random()-0.5)*0.8, uy*sp+(Math.random()-0.5)*0.8, power);
  }
}
function resizeCv(){
  const w=$('gwrap');
  $cv.width=w.offsetWidth;
  $cv.height=w.offsetHeight;
  // Cache cell center coords (relative to canvas) so shockwave head hits are O(1)
  cellCenters.length=0;
  const gridEl=$g;
  const cvr=$cv.getBoundingClientRect();
  for(let i=0;i<gridEl.children.length;i++){
    const cr=gridEl.children[i].getBoundingClientRect();
    cellCenters.push({
      r:Math.floor(i/N), c:i%N,
      x:cr.left-cvr.left+cr.width/2,
      y:cr.top-cvr.top+cr.height/2,
      half:cr.width/2
    });
  }
  updAux();
}

function emit(r,c,bdx,bdy){
  const el=$g.children[r*N+c];if(!el)return;
  const cr=el.getBoundingClientRect(),cvr=$cv.getBoundingClientRect();
  const x=cr.left-cvr.left+cr.width/2, y=cr.top-cvr.top+cr.height/2;
  // molten ejection at the pierce point, biased along the cutting beam
  emitSparks(x,y,bdx||0,bdy||0,26,1.3);
  // a few slow molten droplets that pop upward then drip and cool
  for(let i=0;i<7;i++){
    addSpark(x+(Math.random()-0.5)*8, y, (Math.random()-0.5)*1.4, -0.5-Math.random()*1.0, 0.9);
  }
}

/* ═══ shockwave ═══ */
function emitSW(r,c){
  const el=$g.children[r*N+c];if(!el)return;
  const cr=el.getBoundingClientRect(),cvr=$cv.getBoundingClientRect();
  const cx=cr.left-cvr.left+cr.width/2, cy=cr.top-cvr.top+cr.height/2;
  const isP=theme==='pixel';
  const col=isP?'#ffd700':'#ff8a3c'; // hot cutting-beam color (valley)
  /* Beam reach (px) = spd / 0.028 (life decay per tick). On 6x6+ grids the old
     fixed spd=9 gave ~324px — short of the board diagonal, so far cells never
     saw their color update. Scale spd so reach always covers the full board. */
  const spd=Math.max(isP?14:9, Math.ceil($cv.width*0.03)+2);
  [{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}].forEach(d=>{
    shockwaves.push({x:cx,y:cy,dx:d.dx,dy:d.dy,pos:0,spd,life:1,col});
  });
  // Bright flash at the laser origin (replaces the old dark diamond)
  diamonds.push({x:cx,y:cy,sz:cr.width*0.30,life:1,dec:.05,col:isP?'#ffd700':'#ffb36b'});
}

function tickSW(){
  // Trigger cell-level visual fx when shockwave head enters each affected cell
  if(pendingFx){
    for(const cell of pendingFx.affected){
      if(cell.done)continue;
      // Hit when shockwave head is within this cell's bounds (on the same row or col)
      const cc=cellCenters[cell.key];
      if(!cc)continue;
      const sameRow=cell.r===pendingFx._tapRow;
      const sameCol=cell.c===pendingFx._tapCol;
      const targetX=sameRow?cc.x:pendingFx._tapCx;
      const targetY=sameCol?cc.y:pendingFx._tapCy;
      // Cell distance from tap point (in pixels, same axis as the beam)
      const dx=sameRow?Math.abs(targetX-pendingFx._tapCx):0;
      const dy=sameCol?Math.abs(targetY-pendingFx._tapCy):0;
      // Find a shockwave whose head has traveled far enough to reach this cell
      let hitBeam=null;
      for(const s of shockwaves){
        // Must be a beam going in the direction of this cell
        if(sameRow && s.dy!==0) continue;
        if(sameCol && s.dx!==0) continue;
        const hx=s.x+s.dx*s.pos, hy=s.y+s.dy*s.pos;
        if(sameRow && Math.abs(hy-targetY)<cc.half*0.3){
          // Hit when head has traveled past this cell's center along X
          const fromTap=Math.abs(hx-pendingFx._tapCx);
          if(fromTap>=dx-cc.half*0.2){hitBeam=s;break}
        }
        if(sameCol && Math.abs(hx-targetX)<cc.half*0.3){
          const fromTap=Math.abs(hy-pendingFx._tapCy);
          if(fromTap>=dy-cc.half*0.2){hitBeam=s;break}
        }
      }
      if(hitBeam){
        cell.done=true;
        const el=$g.children[cell.r*N+cell.c];
        if(el){el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),300)}
        upd(cell.r,cell.c);
        // If this cell is in `gone`, also trigger gone animation + particles when the head passes through center
        for(const g of pendingFx.gone){
          if(!g.done && g.key===cell.key){
            g.done=true;
            // Defer gone animation slightly so the head visibly passes through
            setTimeout(()=>{
              const gel=$g.children[g.r*N+g.c];
              if(gel){gel.classList.add('gone');setTimeout(()=>gel.classList.remove('gone'),400)}
              emit(g.r,g.c,hitBeam.dx,hitBeam.dy);
            },40);
          }
        }
      }
    }
    // Unlock busy when all animations done
    if(pendingFx.affected.every(c=>c.done) && pendingFx.gone.every(g=>g.done) && shockwaves.length===0){
      if(theme==='pixel'&&pendingFx.affected.length>0){$g.classList.add('shake');setTimeout(()=>$g.classList.remove('shake'),120)}
      busy=false;
      pendingFx=null;
      updAlive();   // v2.1.0-fix: re-evaluate crack button after fx settles
    }
  }
  for(let i=shockwaves.length-1;i>=0;i--){
    const s=shockwaves[i];
    s.pos+=s.spd;s.life-=.028;
    if(s.life<=0){shockwaves.splice(i,1);continue}
    // v2.0.57: molten grinding sparks spray continuously from the cutting head
    if(parts.length<SPARK_MAX && Math.random()<0.8){
      const hx=s.x+s.dx*s.pos, hy=s.y+s.dy*s.pos;
      const fwd=s.spd*(0.2+Math.random()*0.5);
      addSpark(
        hx+(Math.random()-0.5)*3, hy+(Math.random()-0.5)*3,
        s.dx*fwd+(Math.random()-0.5)*1.8,
        s.dy*fwd+(Math.random()-0.5)*1.8,
        0.75+Math.random()*0.5
      );
      // occasional backward splash — sparks rebounding off the cut
      if(Math.random()<0.35){
        addSpark(hx,hy,
          -s.dx*fwd*0.5+(Math.random()-0.5)*1.4,
          -s.dy*fwd*0.5+(Math.random()-0.5)*1.4,
          0.65);
      }
    }
    const hx=s.x+s.dx*s.pos, hy=s.y+s.dy*s.pos;
    const len=Math.min(s.pos,$cv.width);
    const lx=s.x+s.dx*len, ly=s.y+s.dy*len;
    ctx.save();
    // Outer glow trail
    ctx.strokeStyle=s.col;
    ctx.lineWidth=5+s.life*6;
    ctx.globalAlpha=s.life*0.25;
    ctx.lineCap='round';
    ctx.shadowColor=s.col;
    ctx.shadowBlur=20*s.life;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(lx,ly);ctx.stroke();
    // Mid beam
    ctx.lineWidth=2.5+s.life*3;
    ctx.globalAlpha=s.life*0.5;
    ctx.shadowBlur=12*s.life;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(lx,ly);ctx.stroke();
    // Bright core beam
    ctx.lineWidth=1.2+s.life*1.5;
    ctx.globalAlpha=s.life*0.85;
    ctx.strokeStyle='#fff';
    ctx.shadowColor='#fff';
    ctx.shadowBlur=8*s.life;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(lx,ly);ctx.stroke();
    // Head halo (outer)
    ctx.globalAlpha=s.life*0.7;
    ctx.shadowColor=s.col;
    ctx.shadowBlur=18*s.life;
    ctx.fillStyle=s.col;
    ctx.beginPath();ctx.arc(hx,hy,4+s.life*5,0,Math.PI*2);ctx.fill();
    // Head halo (bright)
    ctx.globalAlpha=s.life;
    ctx.shadowColor='#fff';
    ctx.shadowBlur=20*s.life;
    ctx.fillStyle=s.col;
    ctx.beginPath();ctx.arc(hx,hy,2.5+s.life*3,0,Math.PI*2);ctx.fill();
    // Head center
    ctx.globalAlpha=s.life;
    ctx.shadowBlur=10*s.life;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(hx,hy,1.5+s.life*2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function tickParts(){
  ctx.clearRect(0,0,$cv.width,$cv.height);
  tickSW();
  // Laser-cut micro sparks: additive glow so overlapping sparks bloom white
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.vx*=SPARK_DRAG; p.vy=p.vy*SPARK_DRAG+SPARK_GRAV;
    p.x+=p.vx; p.y+=p.vy;
    p.life-=p.dec;
    if(p.life<=0){parts.splice(i,1);continue}
    const col=sparkColor(p.life);
    // motion streak (the spark streaks as it flies)
    ctx.globalAlpha=Math.min(1,p.life*1.4)*0.8;
    ctx.strokeStyle=col;
    ctx.lineWidth=Math.max(0.6,p.sz*0.9);
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(p.x-p.vx*1.6,p.y-p.vy*1.6);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    // hot core dot
    ctx.globalAlpha=Math.min(1,p.life*1.6)*0.9;
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.sz*(0.5+p.life*0.7),0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1;
  // Rotated 45° diamond — drawn FIRST so laser beams appear to come from its corners
  for(let i=diamonds.length-1;i>=0;i--){
    const d=diamonds[i];
    d.life-=d.dec;
    if(d.life<=0){diamonds.splice(i,1);continue}
    const t=1-d.life;
    const hold=t<0.4?1:1-(t-0.4)/0.6;
    const sz=d.sz*(0.5+hold*0.5);
    ctx.save();
    ctx.translate(d.x,d.y);
    ctx.rotate(Math.PI/4);
    // Bright laser-origin flash: hot outer glow + white core
    const t2=1-d.life;
    ctx.globalCompositeOperation='lighter';
    ctx.shadowColor=d.col;
    ctx.shadowBlur=22*hold;
    ctx.globalAlpha=hold*0.85;
    ctx.fillStyle=d.col;
    ctx.fillRect(-sz/2,-sz/2,sz,sz);
    ctx.globalAlpha=hold;
    ctx.shadowColor='#fff';
    ctx.shadowBlur=16*hold;
    ctx.fillStyle='#fff';
    const cs=sz*0.55*(0.6+0.4*hold);
    ctx.fillRect(-cs/2,-cs/2,cs,cs);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  // Fire win/fail banner only after ALL animation state arrays have drained.
  tryJudge();
  requestAnimationFrame(tickParts);
}

/* ═══ win/fail banner timing ═══ */
// Fires after every animation frame: when shockwaves/diamonds/parts are all empty
// AND pendingFx is null AND there's a stored win/fail result, show the banner.
// This guarantees the banner never appears before the player has seen the laser + particles.
function tryJudge(){
  if(!pendingResult)return;
  if(busy||pendingFx)return;
  if(shockwaves.length||diamonds.length||parts.length)return;
  var r=pendingResult; pendingResult=null;
  playSfx('explosion');
  if(r==='win')showWin();
  else if(r==='fail')showFail();
  updAlive();   // v2.1.0-fix: banner appearing must re-evaluate button state
}

/* ═══ watchdog ═══ */
setInterval(function(){
  // Don't show stuck banner mid-animation — wait for current tap's fx to fully resolve.
  // Must check ALL animation arrays (same condition as tryJudge) so the banner
  // never appears while particles/diamonds are still fading.
  if(typeof busy!=='undefined' && busy)return;
  if(typeof pendingFx!=='undefined' && pendingFx)return;
  if(typeof shockwaves!=='undefined' && shockwaves.length)return;
  
  if(typeof diamonds!=='undefined' && diamonds.length)return;
  if(typeof parts!=='undefined' && parts.length)return;
  var rem=0;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(grid[r][c]>=0)rem++;
  var rmEl=document.getElementById('rm');
  if(rmEl)rmEl.textContent=rem;
  if(rem>0&&rem<TARGET&&!cracking&&!document.getElementById('stuckBanner')){
    playSfx('explosion');
    var div=document.createElement('div');
    div.id='stuckBanner';
    div.innerHTML='<div style="background:var(--hdr,#f5ebe0);border:2px solid var(--accent,#b87060);border-radius:16px;padding:32px 40px;text-align:center;max-width:340px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.5)"><div style="font-size:48px;margin-bottom:8px">✗</div><h2 style="font-size:24px;font-weight:300;letter-spacing:4px;margin-bottom:12px">'+t('stuckTitle')+'</h2><p style="font-size:16px;margin-bottom:8px">'+t('stuckMsg',TARGET)+'</p><p style="font-size:14px;color:#8b7e74;margin-bottom:16px">'+t('stuckSub')+'</p><div style="display:flex;gap:12px;justify-content:center"><button id="stuckRetry" style="background:var(--accent,#b87060);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:bold;cursor:pointer">'+t('restart')+'</button><button id="stuckNew" style="background:var(--cell-empty,rgba(187,173,160,.3));color:var(--txt,#5a4e44);border:1px solid var(--grid,#cdc1b4);border-radius:10px;padding:12px 24px;font-size:14px;font-weight:bold;cursor:pointer">'+t('newGame')+'</button></div></div>';
    div.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;';
    document.body.appendChild(div);
    document.getElementById('stuckRetry').onclick=function(){
      document.getElementById('stuckBanner').remove();
      restartLevel();
    };
    document.getElementById('stuckNew').onclick=function(){
      document.getElementById('stuckBanner').remove();
      newGame();
    };
  }
},300);

    el.innerHTML='';
    const total=lvl*lvl;
    for(let i=0;i<total;i++){
      const d=document.createElement('div');
      // Simple deterministic coloring for preview
      const v=((i*7+(i/lvl|0))*3)%LEVELS[lvl].max;
      d.style.background=PALETTE[v].v;
      d.style.opacity=0.4+(v/LEVELS[lvl].max)*0.6;

  $('bsnd').addEventListener('click',toggleVolPanel);
  $('musicSlider').addEventListener('input',function(){ applyMusicVol(parseInt(this.value)); this.style.setProperty('--fill',this.value+'%'); });
  $('sfxSlider').addEventListener('input',function(){ applySfxVol(parseInt(this.value)); this.style.setProperty('--fill',this.value+'%'); });
  // Click outside closes vol panel
  document.addEventListener('click',function(e){
    var p=$('volPanel');
    if(p && !p.classList.contains('hide') && !p.contains(e.target) && e.target.id!=='bsnd'){
      p.classList.add('hide');
    }
  });
  /* DEBUG: d/t inputs + Apply button (commented out for release)
  var dbgApply=$('dbgApply');
  if(dbgApply){
    dbgApply.addEventListener('click', function(){
      var inpD=$('dbgD'), inpT=$('dbgT');
      if(inpD)_bgmOffset=parseInt(inpD.value)||_bgmOffset;
      if(inpT)_bgmPeriod=parseInt(inpT.value)||_bgmPeriod;
      if(_bgmActive && soundOn){ stopBgm(); startBgm(); }
      if(_trackViewOn) drawTracks();
    });
  }
  // Toggle between track view and grid
  var dbgGrid=$('dbgGrid');
  if(dbgGrid){
    dbgGrid.addEventListener('click', hideTrackView);
  }
  */
  // Restore persisted volume slider positions
  (function(){
    var ms=$('musicSlider'), ss=$('sfxSlider');
    if(ms){ var mv=Math.round(musicVol*100); ms.value=mv; ms.style.setProperty('--fill',mv+'%'); }
    if(ss){ var sv=Math.round(sfxVol*100); ss.value=sv; ss.style.setProperty('--fill',sv+'%'); }
    var mvLbl=$('musicVal'), svLbl=$('sfxVal');
    if(mvLbl) mvLbl.textContent=Math.round(musicVol*100);
    if(svLbl) svLbl.textContent=Math.round(sfxVol*100);
  })();
  $('bCopySeed').addEventListener('click',()=>{
    const txt=curSeed.toString(16).padStart(8,'0');
    const ok=()=>{const btn=$('bCopySeed');const old=btn.textContent;btn.style.minWidth=btn.offsetWidth+'px';btn.textContent=t('copied');setTimeout(()=>{btn.textContent=old;btn.style.minWidth='';},1200);};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok));
    }else{
      fallbackCopy(txt,ok);
    }
    function fallbackCopy(s,after){
      try{
        const ta=document.createElement('textarea');
        ta.value=s;ta.style.cssText='position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta);ta.focus();ta.select();
        const done=document.execCommand('copy');
        ta.remove();
        if(done&&after)after();
        else if(window.Android&&Android.toast)Android.toast('Seed: '+s);
        else prompt('Seed:',s);
      }catch(e){
        if(window.Android&&Android.toast)Android.toast('Seed: '+s);
        else prompt('Seed:',s);
      }
    }
  });
  $('bLoadSeed').addEventListener('click',()=>{
    const ov=$('seedOv');ov.classList.remove('hide');
    $('seedIn').value='';
    const card=ov.querySelector('.help-card');if(card)card.style.transform='';
    setTimeout(()=>$('seedIn').focus(),100);
  });
  $('seedOv').addEventListener('click',e=>{if(e.target===$('seedOv'))$('seedOv').classList.add('hide');});
  $('seedConfirm').addEventListener('click',loadSeedFromInput);
  $('seedIn').addEventListener('keydown',e=>{if(e.key==='Enter')loadSeedFromInput();});
  // Keyboard viewport handling
  if(window.visualViewport){
    const seedOv=$('seedOv');
    const adjustVP=()=>{
      if(seedOv.classList.contains('hide'))return;
      const card=seedOv.querySelector('.help-card');
      if(!card)return;
      const vp=window.visualViewport;
      const kbH=Math.max(0,window.innerHeight-vp.height-vp.offsetTop);
      card.style.transform=kbH>50?'translateY(-'+Math.min(kbH*0.4,120)+'px)':'';
    };
    window.visualViewport.addEventListener('resize',adjustVP);
    window.visualViewport.addEventListener('scroll',adjustVP);
  }
  $('bImport').addEventListener('click',()=>{
    $('importOv').classList.remove('hide');
    $('gridIn').value='';
    setTimeout(()=>$('gridIn').focus(),100);
  });
  $('importOv').addEventListener('click',e=>{if(e.target===$('importOv'))$('importOv').classList.add('hide');});
  $('importConfirm').addEventListener('click',importGrid);
  $('bx').addEventListener('click',()=>{
    const action=$('bx').dataset.action;
    if(action==='retry')restartLevel();else newGame();
  });
}
init();
/* v2.0.70-numbers: test hooks — expose internals for automated verification */
window.__t={
  grid:()=>grid, N:()=>N, MAX:()=>MAX, theme:()=>theme, sol:()=>sol, taps:()=>taps,
  numLabel, setNum, numTextColor, cellColor,
  auxNumbers, lineMin, updAux,
  aliveStatus, tapCountsNow, resetCrackState, crack, updAlive, gameOver:()=>gameOver,
  tap:(r,c)=>tap(r,c), undo
};
})();
</script>
